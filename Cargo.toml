[workspace]
resolver = "2"
members = ["subscription", "receipt"]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["KickProb Contributors"]
license = "MIT"
repository = "https://github.com/KickProb/contract"

[workspace.dependencies]
soroban-sdk = "22.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
